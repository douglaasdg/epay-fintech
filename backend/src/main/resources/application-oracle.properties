# =====================================================================
# PERFIL ORACLE (CONEXÃO COM A BASE ACADÊMICA DA FIAP)
# Para ativar este perfil: defina spring.profiles.active=oracle no application.properties
# =====================================================================

spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.username=${FIAP_ORACLE_USER:RM566847}
spring.datasource.password=${FIAP_ORACLE_PASSWORD:120598}

# Configurações do Hibernate para Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Pool de Conexões (HikariCP) para o Oracle FIAP
# A FIAP limita sessões simultâneas por aluno (SESSIONS_PER_USER) a 1-2 conexões
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000

