# =====================================================================
# CONFIGURAÇÃO GERAL DA APLICAÇÃO E-PAY FINTECH
# =====================================================================
spring.application.name=epay-fintech
server.port=8080

# Perfil ativo por padrão: 'dev' (H2 rápido em memória com carga de dados para nuvem e testes)
# Para conectar ao Oracle da FIAP, defina no Render a variável de ambiente SPRING_PROFILES_ACTIVE=oracle
# ou altere aqui para oracle quando for rodar localmente apontando para a faculdade.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =====================================================================
# SEGURANÇA E JWT (JSON Web Token)
# =====================================================================
epay.security.jwt.secret=epay-fintech-super-segredo-jwt-2026-chave-forte-criptografada
epay.security.jwt.expiration-hours=24

# =====================================================================
# DOCUMENTAÇÃO SWAGGER / OPENAPI 3
# =====================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# =====================================================================
# PERFIL DEV (H2 DATABASE)
# =====================================================================
spring.datasource.url=jdbc:h2:mem:epaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console acessível no navegador em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate no H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
